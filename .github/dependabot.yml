version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      runtime:
        patterns: ["httpx*", "pydantic*", "tenacity", "typer", "rich"]
      dev:
        patterns: ["pytest*", "ruff", "mypy*", "fakeredis", "types-*"]
      redis:
        patterns: ["redis"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
